name: Update public character profiles

on:
  schedule:
    # Use an explicit timezone rather than relying on the scheduler's default.
    - cron: '0 18 * * WED'
      timezone: 'Asia/Shanghai'
    # Retry at 18:17, 19:17, 20:17, 21:17 and 22:17 Beijing time if no collection succeeded.
    - cron: '17 18-22 * * WED'
      timezone: 'Asia/Shanghai'
    # Catch up on Thursday if Wednesday's scheduled events were dropped.
    - cron: '17 6,12 * * THU'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
    inputs:
      refresh_all:
        description: Refresh profiles already present in the public cache
        type: boolean
        default: false
      scheduled_check:
        description: Skip collection if this week's collection already succeeded
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: character-profile-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check weekly collection window
        id: weekly
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_WEEKLY_SCHEDULE: ${{ inputs.scheduled_check && '1' || '0' }}
        run: python3 character-profiles/tools/weekly_collection_schedule.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.weekly.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: character-profiles/cloud-requirements.txt
      - name: Install collection dependency
        if: steps.weekly.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check -r character-profiles/cloud-requirements.txt
      - name: Start private cloud proxy if configured
        if: steps.weekly.outputs.run == 'true'
        id: proxy
        env:
          DMM_MIHOMO_NODE_JSON: ${{ secrets.DMM_MIHOMO_NODE_JSON }}
        run: python character-profiles/tools/cloud_proxy_runner.py start
      - name: Collect public profiles using the platform login
        if: steps.weekly.outputs.run == 'true'
        env:
          DMM_COOKIES_JSON: ${{ secrets.DMM_COOKIES_JSON }}
          DMM_HTTP_PROXY: ${{ steps.proxy.outputs.proxy_url || secrets.DMM_HTTP_PROXY }}
          DMM_REFRESH_ALL: ${{ inputs.refresh_all && '1' || '0' }}
        run: python character-profiles/tools/cloud_collect_profiles.py
      - name: Commit validated public metadata
        if: steps.weekly.outputs.run == 'true'
        env:
          META_PROVIDER: github
          META_GIT_USER: x-access-token
          META_GIT_TOKEN: ${{ github.token }}
          META_REPOSITORY: ${{ github.repository }}
          META_BRANCH: ${{ github.ref_name }}
        run: python character-profiles/tools/cloud_publish_gitee.py
      - name: Mirror validated public metadata to Gitee
        if: steps.weekly.outputs.run == 'true'
        env:
          META_GIT_USER: weeww123321
          META_GIT_TOKEN: ${{ secrets.GITEE_GIT_TOKEN }}
          META_REPOSITORY: weeww123321/escah
          META_BRANCH: master
        run: python character-profiles/tools/cloud_mirror_gitee.py
      - name: Remove temporary proxy configuration
        if: always() && steps.weekly.outputs.run == 'true'
        run: python character-profiles/tools/cloud_proxy_runner.py stop
